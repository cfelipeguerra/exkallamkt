<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
.og{position:relative;width:1200px;height:630px;color:#fff;font-family:"Figtree",sans-serif;padding:64px 70px;
 background:radial-gradient(700px 520px at 92% 8%,rgba(254,126,1,.22),transparent 62%),radial-gradient(600px 600px at 0% 100%,rgba(255,255,255,.06),transparent 60%),#08213d}
.og::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:#fe7e01}
.brand{display:flex;align-items:center;gap:16px;font:800 38px "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.brand img{width:60px;height:60px;border-radius:14px}
h1{margin-top:46px;width:600px;font:800 64px/1.04 "Bricolage Grotesque",sans-serif;letter-spacing:-.025em}
h1 em{font-style:normal;color:#fe7e01}
p{margin-top:24px;width:540px;font:500 25px/1.4 "Figtree",sans-serif;color:#b9c6d8}
.stack{position:absolute;right:56px;top:150px;width:440px;display:grid;gap:16px}
.msg{background:#e9eef4;color:#08213d;border-radius:20px;padding:16px 20px;font:600 21px/1.35 "Figtree",sans-serif;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.msg.out{background:#ffe8d1;margin-left:44px}
.sale{display:flex;align-items:center;gap:16px;background:#fe7e01;color:#08213d;border-radius:20px;padding:18px 20px;box-shadow:0 18px 40px rgba(254,126,1,.35)}
.sale .ck{width:54px;height:54px;border-radius:50%;background:#08213d;color:#fe7e01;display:grid;place-items:center;flex:none}
.sale b{display:block;font:800 27px/1.1 "Bricolage Grotesque",sans-serif}
.sale span{font:600 17px "Figtree",sans-serif}
.dest{display:flex;gap:10px}
.dest span{flex:1;text-align:center;background:#0f2f55;border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 8px;font:500 16px;white-space:nowrap "IBM Plex Mono",monospace;color:#86efac}
</style></head><body>
<div class="og">
  <div class="brand"><img src="data:image/png;base64,__ICON__" alt="">Vendeuzap</div>
  <h1>Descubra quais anúncios <em>vendem</em> no seu WhatsApp.</h1>
  <p>Cada venda identificada na conversa e enviada para a Meta e o Google, com o valor.</p>
  <div class="stack">
    <div class="msg">Oi! Vi o anúncio, ainda está valendo?</div>
    <div class="msg out"><b>Pagamento confirmado!</b> Total R$&nbsp;389,90</div>
    <div class="sale"><span class="ck"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><div><b>Venda identificada</b><span>R$ 389,90 · Anúncio no WhatsApp</span></div></div>
    <div class="dest"><span>✓ Meta</span><span>✓ Google Analytics</span></div>
  </div>
</div>
</body></html>
